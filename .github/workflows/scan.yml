name: Scan for arbitrage opportunities

on:
  schedule:
    # Every 10 minutes. GitHub may delay this somewhat under load - that's
    # fine for a logging-only scanner.
    - cron: "*/10 * * * *"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run scanner
        run: node scripts/scan.mjs

      - name: Commit updated log
        run: |
          git config user.name "arb-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/opportunity-log.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Scan: update opportunity log [skip ci]"
            git push
          fi
